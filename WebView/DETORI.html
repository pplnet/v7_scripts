<!-- ============================================================================
     DETORI - Detalle Ordenes de Inversion
     Fragmento: se inyecta dentro del <body>. Sin <html>, <head>, <body> ni <script>.
     ============================================================================ -->
<div class="container-fluid py-3 detori-app">

    <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
        <h4 class="mb-0"><i class="fas fa-list-alt"></i> Detalle Órdenes de Inversión</h4>
        <small id="ws-status" class="text-muted"><i class="fas fa-circle"></i> Conectando…</small>
    </div>

    <form id="detori-filtros" class="form-row align-items-end mb-3" autocomplete="off">

        <div class="col-auto">
            <label for="detori-fecha" class="mb-1">Fecha</label>
            <input type="date" id="detori-fecha" class="form-control form-control-sm">
        </div>

        <!-- Vehiculo con lookup -->
        <div class="col-auto">
            <label class="mb-1">Vehículo</label>
            <div class="input-group input-group-sm">
                <input type="text" id="detori-vehiculo" class="form-control form-control-sm detori-input-cod"
                       placeholder="Todos" maxlength="20">
                <div class="input-group-append">
                    <button type="button" class="btn btn-outline-secondary detori-lkp-btn"
                            data-lookup="vehiculo" tabindex="-1" title="Buscar vehículo">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Book con lookup -->
        <div class="col-auto">
            <label class="mb-1">Book</label>
            <div class="input-group input-group-sm">
                <input type="text" id="detori-book" class="form-control form-control-sm detori-input-cod"
                       placeholder="Todos" maxlength="20">
                <div class="input-group-append">
                    <button type="button" class="btn btn-outline-secondary detori-lkp-btn"
                            data-lookup="book" tabindex="-1" title="Buscar book">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Especie con lookup -->
        <div class="col-auto">
            <label class="mb-1">Especie</label>
            <div class="input-group input-group-sm">
                <input type="text" id="detori-especie" class="form-control form-control-sm detori-input-cod"
                       placeholder="Todas" maxlength="20">
                <div class="input-group-append">
                    <button type="button" class="btn btn-outline-secondary detori-lkp-btn"
                            data-lookup="especie" tabindex="-1" title="Buscar especie">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="col-auto">
            <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Buscar</button>
        </div>
        <div class="col text-right">
            <span class="text-muted">Registros: <strong id="detori-total-filas">0</strong></span>
        </div>
    </form>

    <div id="loading" class="detori-loading" style="display:none">
        <span class="spinner-border spinner-border-sm text-primary" role="status"></span> Cargando…
    </div>

    <div id="detori-aviso"></div>

    <div class="detori-tabla-wrap">
        <table id="detori-dt" class="table table-sm table-striped table-hover w-100"></table>
    </div>

    <div id="detori-saldo" class="detori-saldo d-none">
        <span class="font-weight-bold">Saldo:</span>
        <span id="detori-saldo-valor" class="ml-2 font-weight-bold"></span>
    </div>

</div>

<!-- Modal Vehículo -->
<div class="modal fade" id="detori-modal-vehiculo" tabindex="-1" role="dialog" aria-labelledby="detori-modal-vehiculo-titulo">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" id="detori-modal-vehiculo-titulo"><i class="fas fa-search"></i> Seleccioná un vehículo</h6>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body p-2 detori-modal-body">
                <table id="detori-tbl-vehiculo" class="table table-sm table-hover w-100"></table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Book -->
<div class="modal fade" id="detori-modal-book" tabindex="-1" role="dialog" aria-labelledby="detori-modal-book-titulo">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" id="detori-modal-book-titulo"><i class="fas fa-search"></i> Seleccioná un book</h6>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body p-2 detori-modal-body">
                <table id="detori-tbl-book" class="table table-sm table-hover w-100"></table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Especie -->
<div class="modal fade" id="detori-modal-especie" tabindex="-1" role="dialog" aria-labelledby="detori-modal-especie-titulo">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" id="detori-modal-especie-titulo"><i class="fas fa-search"></i> Seleccioná una especie</h6>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body p-2 detori-modal-body">
                <table id="detori-tbl-especie" class="table table-sm table-hover w-100"></table>
            </div>
        </div>
    </div>
</div>
