<!-- ============================================================================
     HTML: Monitor de Notificaciones en Tiempo Real (MNTNTF)
     ============================================================================
     Este HTML se inyecta dentro del <body> del documento final
     ============================================================================ -->

<div class="container-fluid py-4">

    <!-- Header -->
    <div class="row mb-3">
        <div class="col-12 d-flex justify-content-between align-items-center flex-wrap">
            <h2 class="mb-0">
                <i class="fas fa-satellite-dish"></i>
                Monitor de Notificaciones
            </h2>
            <small id="ws-status" class="text-muted">
                <i class="fas fa-circle"></i> Conectando...
            </small>
        </div>
    </div>

    <!-- Tarjetas de Estadisticas -->
    <div class="row mb-3" id="stats-cards">
        <div class="col">
            <div class="card bg-primary text-white">
                <div class="card-body py-2">
                    <h6 class="card-title mb-1">Total</h6>
                    <h3 class="mb-0" id="stat-total">0</h3>
                    <small>recibidas</small>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card bg-info text-white">
                <div class="card-body py-2">
                    <h6 class="card-title mb-1">Info</h6>
                    <h3 class="mb-0" id="stat-info">0</h3>
                    <small>informativas</small>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card bg-warning text-white">
                <div class="card-body py-2">
                    <h6 class="card-title mb-1">Warning</h6>
                    <h3 class="mb-0" id="stat-warning">0</h3>
                    <small>advertencias</small>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card bg-danger text-white">
                <div class="card-body py-2">
                    <h6 class="card-title mb-1">Error</h6>
                    <h3 class="mb-0" id="stat-error">0</h3>
                    <small>criticos</small>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card bg-dark text-white">
                <div class="card-body py-2">
                    <h6 class="card-title mb-1">Procesos</h6>
                    <h3 class="mb-0" id="stat-procesos">0</h3>
                    <small>eventos PPL</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra de Filtros -->
    <div class="row mb-3 align-items-end">
        <div class="col-md-3">
            <label for="filter-tipo" class="mb-1">Tipo</label>
            <select id="filter-tipo" class="form-control form-control-sm">
                <option value="">Todos los tipos</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="filter-severidad" class="mb-1">Severidad</label>
            <select id="filter-severidad" class="form-control form-control-sm">
                <option value="">Todas</option>
                <option value="info">Info</option>
                <option value="warning">Warning</option>
                <option value="error">Error</option>
            </select>
        </div>
        <div class="col-md-6 text-md-right mt-2 mt-md-0">
            <button class="btn btn-sm btn-outline-secondary" id="btn-pause">
                <i class="fas fa-pause"></i> Pausar
            </button>
            <button class="btn btn-sm btn-outline-danger" id="btn-clear">
                <i class="fas fa-trash"></i> Limpiar
            </button>
            <div class="form-check form-check-inline ml-2">
                <input class="form-check-input" type="checkbox" id="chk-autoscroll" checked>
                <label class="form-check-label" for="chk-autoscroll">Auto-scroll</label>
            </div>
        </div>
    </div>

    <!-- Tabla de Notificaciones -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <table id="dt1" class="table table-striped table-bordered table-hover table-sm" style="width:100%">
                        <thead class="thead-dark">
                            <tr>
                                <th width="30"></th>
                                <th>Hora</th>
                                <th>Tipo</th>
                                <th>Origen</th>
                                <th>Grupo</th>
                                <th>Severidad</th>
                                <th>Mensaje</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>
