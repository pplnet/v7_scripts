<!-- ============================================================================
     HTML: ABM de Usuarios
     ============================================================================
     Alta, Baja y Modificación de Usuarios del sistema.
     Contiene dos vistas: Grilla principal y Formulario de edición.
     ============================================================================ -->

<div class="container-fluid py-3">

    <!-- ====================================================================
         VISTA 1: GRILLA PRINCIPAL
         ==================================================================== -->
    <div id="view-grid">

        <!-- Header -->
        <div class="row mb-2">
            <div class="col-12">
                <h5 class="mb-0">
                    <i class="fas fa-users"></i>
                    Usuarios
                </h5>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="row mb-2">
            <div class="col-12 d-flex align-items-center justify-content-between">
                <div class="btn-toolbar" role="toolbar">
                    <div class="btn-group btn-group-sm mr-2" role="group">
                        <button type="button" class="btn btn-outline-success" id="btn-alta" title="Alta">
                            <i class="fas fa-plus"></i> Alta
                        </button>
                        <button type="button" class="btn btn-outline-danger" id="btn-baja" title="Baja">
                            <i class="fas fa-minus"></i> Baja
                        </button>
                        <button type="button" class="btn btn-outline-primary" id="btn-modificacion" title="Modificación">
                            <i class="fas fa-pencil-alt"></i> Modificación
                        </button>
                        <button type="button" class="btn btn-outline-info" id="btn-visualizacion" title="Visualización">
                            <i class="fas fa-eye"></i> Visualización
                        </button>
                    </div>
                    <div class="btn-group btn-group-sm" role="group">
                        <button type="button" class="btn btn-outline-secondary" id="btn-actualizar" title="Actualizar">
                            <i class="fas fa-sync-alt"></i> Actualizar
                        </button>
                    </div>
                </div>
                <div class="form-inline">
                    <label class="mr-2 small">Filtros:</label>
                    <input type="text" class="form-control form-control-sm" id="input-filtro"
                           placeholder="Buscar..." style="width: 200px;">
                </div>
            </div>
        </div>

        <!-- Indicador de Carga -->
        <div id="loading" class="text-center py-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Cargando...</span>
            </div>
            <p class="mt-2">Cargando usuarios...</p>
        </div>

        <!-- Tabla de Usuarios -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body p-0">
                        <table id="dt1" class="table table-striped table-bordered table-hover mb-0" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Jerarquía</th>
                                    <th>Código</th>
                                    <th>Nombre</th>
                                    <th>Perfiles</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- DataTables llenará esto dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ====================================================================
         VISTA 2: FORMULARIO (Alta / Modificación / Visualización)
         ==================================================================== -->
    <div id="view-form" style="display: none;">

        <!-- Header del Formulario -->
        <div class="row mb-2">
            <div class="col-12">
                <h5 class="mb-0">
                    <i class="fas fa-user-edit" id="form-icon"></i>
                    <span id="form-title">Usuarios - Alta</span>
                </h5>
            </div>
        </div>

        <!-- Toolbar del Formulario -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="btn-toolbar" role="toolbar">
                    <div class="btn-group btn-group-sm" role="group">
                        <button type="button" class="btn btn-success" id="btn-confirmar" title="Confirmar">
                            <i class="fas fa-check"></i> Confirmar
                        </button>
                        <button type="button" class="btn btn-danger" id="btn-cancelar" title="Cancelar">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button type="button" class="btn btn-secondary" id="btn-volver" title="Volver">
                            <i class="fas fa-arrow-left"></i> Volver
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pestaña General -->
        <div class="row">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header py-2">
                        <span class="small font-weight-bold">General</span>
                    </div>
                    <div class="card-body">
                        <form id="form-usuario">

                            <div class="form-group row mb-2">
                                <label for="fld-jerarquia" class="col-sm-3 col-form-label col-form-label-sm">Jerarquía:</label>
                                <div class="col-sm-5">
                                    <input type="text" class="form-control form-control-sm" id="fld-jerarquia"
                                           maxlength="15" placeholder="Ej: 001000000000000">
                                </div>
                            </div>

                            <div class="form-group row mb-2">
                                <label for="fld-codigo" class="col-sm-3 col-form-label col-form-label-sm">Código:</label>
                                <div class="col-sm-4">
                                    <input type="text" class="form-control form-control-sm" id="fld-codigo"
                                           maxlength="10" placeholder="Ej: CLOMAS">
                                </div>
                            </div>

                            <div class="form-group row mb-2">
                                <label for="fld-nombre" class="col-sm-3 col-form-label col-form-label-sm">Nombre:</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control form-control-sm" id="fld-nombre"
                                           maxlength="50" placeholder="Nombre completo del usuario">
                                </div>
                            </div>

                            <div class="form-group row mb-2">
                                <label for="fld-perfil" class="col-sm-3 col-form-label col-form-label-sm">Perfiles:</label>
                                <div class="col-sm-3">
                                    <select class="form-control form-control-sm" id="fld-perfil">
                                        <option value="">Seleccione...</option>
                                        <!-- Opciones se cargan dinámicamente -->
                                    </select>
                                </div>
                                <div class="col-sm-6 d-flex align-items-center">
                                    <span class="small text-muted" id="lbl-perfil-desc"></span>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ====================================================================
         MODAL: Confirmación de Baja
         ==================================================================== -->
    <div class="modal fade" id="modalDelete" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white py-2">
                    <h6 class="modal-title"><i class="fas fa-exclamation-triangle"></i> Confirmar Baja</h6>
                    <button type="button" class="close text-white" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">¿Está seguro que desea eliminar el usuario <strong id="delete-codigo"></strong>?</p>
                </div>
                <div class="modal-footer py-1">
                    <button type="button" class="btn btn-sm btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-sm btn-danger" id="btn-confirm-delete">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>
