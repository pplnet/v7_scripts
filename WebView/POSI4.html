<!-- ============================================================================
     HTML: Posiciones y Resultados en Tiempo Real
     ============================================================================ -->

<div class="container-fluid posi4-app">

    <!-- Header -->
    <div class="row posi4-header">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-0 font-weight-bold">Posiciones</h4>
                <small class="text-muted">Posiciones netas calculadas desde operaciones &mdash; tiempo real</small>
            </div>
            <small id="ws-status" class="posi4-ws-status">
                <span class="posi4-ws-dot"></span> Conectando...
            </small>
        </div>
    </div>

    <!-- Estadisticas -->
    <div class="row mt-3 mb-3" id="stats-cards">
        <div class="col-md-3">
            <div class="posi4-stat-card">
                <div class="posi4-stat-label">OPERACIONES</div>
                <div class="posi4-stat-value" id="stat-especies">0</div>
                <div class="posi4-stat-sub">total</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="posi4-stat-card">
                <div class="posi4-stat-label">VEH&Iacute;CULOS</div>
                <div class="posi4-stat-value" id="stat-vehiculos">0</div>
                <div class="posi4-stat-sub">activos</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="posi4-stat-card">
                <div class="posi4-stat-label">COMPRAS</div>
                <div class="posi4-stat-value" id="stat-titulos">0</div>
                <div class="posi4-stat-sub">cantidad</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="posi4-stat-card">
                <div class="posi4-stat-label">VENTAS</div>
                <div class="posi4-stat-value" id="stat-fx">0</div>
                <div class="posi4-stat-sub">cantidad</div>
            </div>
        </div>
    </div>

    <!-- Filtros -->
    <div class="row mb-3">
        <div class="col-md-2">
            <label class="posi4-filter-label">FECHA</label>
            <input type="date" class="form-control posi4-input" id="filter-fecha">
        </div>
        <div class="col-md-2">
            <label class="posi4-filter-label">ESPECIE</label>
            <input type="text" class="form-control posi4-input" id="filter-especie" placeholder="Todas">
        </div>
        <div class="col-md-2">
            <label class="posi4-filter-label">VEH&Iacute;CULO</label>
            <select class="form-control posi4-input" id="filter-vehiculo">
                <option value="">Todos</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="posi4-filter-label">BOOK</label>
            <select class="form-control posi4-input" id="filter-book">
                <option value="">Todos</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="posi4-filter-label">INCLUYE $</label>
            <select class="form-control posi4-input" id="filter-pesos">
                <option value="0">No</option>
                <option value="1">S&iacute;</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="posi4-filter-label">&nbsp;</label>
            <button class="btn posi4-btn-primary w-100" id="btn-refresh">
                Actualizar
            </button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-4" style="display: none;">
        <div class="spinner-border text-dark" role="status">
            <span class="sr-only">Cargando...</span>
        </div>
        <p class="mt-2 text-muted">Cargando posiciones...</p>
    </div>

    <!-- Tabla -->
    <div class="row">
        <div class="col-12">
            <div class="posi4-table-card">
                <table id="dt1" class="table table-hover" style="width:100%">
                    <thead>
                        <tr>
                            <th width="30"></th>
                            <th>Especie</th>
                            <th>C.Esp.</th>
                            <th>Veh&iacute;culo</th>
                            <th>Book</th>
                            <th>Compras</th>
                            <th>Ventas</th>
                            <th>Posici&oacute;n Neta</th>
                            <th>Precio Prom.</th>
                            <th>Valuaci&oacute;n</th>
                            <th>Ops</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

</div>
