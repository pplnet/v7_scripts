<!-- ============================================================================
     HTML: Posiciones y Resultados - POSI4
     ============================================================================ -->

<div class="container-fluid posi4-app">

    <!-- Graficos de Valuacion -->
    <div class="row mt-2 mb-3" id="charts-row">
        <div class="col-md-6">
            <div class="posi4-chart-container">
                <h6 class="posi4-chart-title">Valuaci&oacute;n USD</h6>
                <canvas id="chart-usd"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="posi4-chart-container">
                <h6 class="posi4-chart-title">Valuaci&oacute;n ARP</h6>
                <canvas id="chart-arp"></canvas>
            </div>
        </div>
    </div>

    <!-- Filtros -->
    <div class="row mb-3">
        <div class="col-md-2">
            <label class="posi4-filter-label">FECHA</label>
            <input type="date" class="form-control posi4-input" id="filter-fecha">
        </div>
        <div class="col-md-4">
            <label class="posi4-filter-label">SELECCI&Oacute;N DE ESPECIE</label>
            <input type="text" class="form-control posi4-input" id="filter-especie" placeholder="Todas">
        </div>
        <div class="col-md-4">
            <label class="posi4-filter-label">TIPO ESPECIE</label>
            <select class="form-control posi4-input" id="filter-tipo-especie">
                <option value="">Todos</option>
                <option value="TITULO">T&iacute;tulos</option>
                <option value="MONEDA">Monedas</option>
                <option value="FONDOS">Fondos</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="posi4-filter-label">&nbsp;</label>
            <button class="btn posi4-btn-primary w-100" id="btn-refresh">
                Aplicar
            </button>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-4" style="display: none;">
        <div class="spinner-border text-dark" role="status">
            <span class="sr-only">Cargando...</span>
        </div>
        <p class="mt-2 text-muted">Cargando posiciones...</p>
    </div>

    <!-- Tabla -->
    <div class="row">
        <div class="col-12">
            <div class="posi4-table-card">
                <table id="dt1" class="table table-hover" style="width:100%">
                    <thead>
                        <tr>
                            <th width="30"></th>
                            <th>Especie</th>
                            <th>C.Esp.</th>
                            <th>Pos. Inicial</th>
                            <th>Compras</th>
                            <th>Ventas</th>
                            <th>Posici&oacute;n Neta</th>
                            <th>Precio Fin</th>
                            <th>Valuaci&oacute;n</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- WebSocket status -->
    <div class="row mt-2">
        <div class="col-12 text-right">
            <small id="ws-status" class="posi4-ws-status">
                <span class="posi4-ws-dot"></span> Conectando...
            </small>
        </div>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
